        /* 音乐列表 */
        #container {

            height: 300px;
            margin: 50px auto 50px;

            padding: 20px;
            color: #fff;

            text-align: center;
        }
        #container p {

            line-height: 1.8;
        }

        #container2 {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 50px; /* 整体卡片（盒子+文字）之间的间距 */
            max-width: 1200px;
            margin: 80px auto;
            padding: 40px;
            /* border: 3px solid green; */
            background-color: #ffffff57;
        }

        .music-item {
            display: flex;
            flex-direction: column; /* 纵向排列：盒子在上，文字在下 */
            align-items: center; /* 水平居中 */
            gap: 15px; /* 盒子和文字之间的间距 */
            cursor: pointer; /* 鼠标移上去变手型，提示可点击 */
        }

        .music-item .box {
            width: 200px;
            height: 200px;
            /* border: 3px solid red; */
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden; /* 隐藏超出盒子的图片部分 */
            border-radius: 8px; /* 可选：圆角更美观 */
        }
        
        .music-item .box img {
            width: 100%; /* 图片宽度铺满盒子 */
            height: 100%; /* 图片高度铺满盒子 */
            object-fit: cover; /* 保持图片比例，裁剪多余部分 */
            transition: all 0.3s ease;
        }

        /* 1. 新增：旋转动画关键帧 */
        @keyframes rotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        /* 2. 新增：旋转类 - 播放时添加 */
        .rotate {
            animation: rotate 8s linear infinite; /* 8秒一圈，匀速无限旋转 */
        }

        .music-text {
            font-size: 20px;
            color: #fff;
            text-align: center;
            padding: 5px 15px;
            border-radius: 8px;
            background: rgba(255,255,255,0.1);
            transition: all 0.3s ease;
        }

        .music-item:hover .music-text {
            background: #0c3a5d;
            color: #fff;
        }

        audio {
            display: none;
        }
    </style>

    <!-- JS交互逻辑：控制播放/暂停+旋转 -->
    <script>
        // 记录当前播放的音乐ID，避免多首同时播放
        let currentPlayId = null;

        // 播放/暂停切换函数
        function toggleMusic(id) {
            // 获取对应音频和图片元素
            const audio = document.getElementById(`audio${id}`);
            const img = document.getElementById(`img${id}`);

            // 如果有其他音乐在播放，先暂停
            if (currentPlayId && currentPlayId !== id) {
                const oldAudio = document.getElementById(`audio${currentPlayId}`);
                const oldImg = document.getElementById(`img${currentPlayId}`);
                oldAudio.pause();
                oldImg.classList.remove('rotate'); // 停止旋转
            }

            // 切换当前音乐状态
            if (audio.paused) {
                audio.play().catch(err => {
                    alert(`音乐${id}播放失败：${err.message}\n请检查音乐链接`);
                });
                img.classList.add('rotate'); // 添加旋转类
                currentPlayId = id;
            } else {
                audio.pause();
                img.classList.remove('rotate'); // 移除旋转类
                currentPlayId = null;
            }
        }
    </script>
