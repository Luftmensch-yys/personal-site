<!DOCTYPE html>

    <title>游戏页</title>
    <style>
        .game-list {
            width: min(720px, calc(100% - 48px));
            margin: 0 auto 80px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .game-card {
            display: block;
            padding: 28px 32px;
            border: 1px solid var(--line);
            border-radius: 16px;
            background: var(--panel);
            color: var(--ink);
            text-decoration: none;
            transition: background 0.25s ease, transform 0.25s ease;
        }

        .game-card:hover {
            background: rgba(255, 255, 255, 0.06);
            transform: translateY(-2px);
        }

        .game-card h2 {
            font-size: 28px;
            font-weight: 500;
            letter-spacing: -0.02em;
        }

        .game-card p {
            margin-top: 10px;
            color: var(--muted);
            font-size: 15px;
            line-height: 1.7;
        }
    </style>
</head>
