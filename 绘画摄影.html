<!DOCTYPE html>

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="init.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="nav.css">
    <link rel="stylesheet" href="site.css">
    <title>绘画摄影</title>
    <style>
        body.gallery-page {
            overflow-x: hidden;
        }

        .photo-mosaic {
            width: min(1280px, calc(100% - 48px));
            margin: 0 auto 96px;
            display: grid;
            grid-template-columns: repeat(12, minmax(0, 1fr));
            grid-auto-rows: 120px;
            gap: 14px;
        }

        .photo-item {
            position: relative;
            overflow: hidden;
            border-radius: 14px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            background: rgba(255, 255, 255, 0.02);
            opacity: 0;
            transform: translateY(24px) scale(0.98);
            transition:
                opacity 0.7s ease,
                transform 0.7s cubic-bezier(0.16, 1, 0.3, 1),
                border-color 0.25s ease;
        }

        .photo-item.is-visible {
            opacity: 1;
            transform: translateY(0) scale(1);
        }

        .photo-item:hover {
            border-color: rgba(145, 222, 254, 0.28);
        }

        .photo-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center;
            transition: transform 0.65s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .photo-item:hover img {
            transform: scale(1.05);
        }

        .photo-item::after {
            content: "";
            position: absolute;
            inset: 0;
            background: linear-gradient(180deg, transparent 55%, rgba(6, 6, 12, 0.42) 100%);
            opacity: 0;
            transition: opacity 0.3s ease;
            pointer-events: none;
        }

        .photo-item:hover::after {
            opacity: 1;
        }

        .photo-item--hero {
            grid-column: span 7;
            grid-row: span 4;
        }

        .photo-item--wide {
            grid-column: span 5;
            grid-row: span 2;
        }

        .photo-item--tall {
            grid-column: span 4;
            grid-row: span 3;
        }

        .photo-item--medium {
            grid-column: span 4;
            grid-row: span 2;
        }

        .photo-item--small {
            grid-column: span 3;
            grid-row: span 2;
        }

        @media (max-width: 1024px) {
            .photo-mosaic {
                grid-template-columns: repeat(6, minmax(0, 1fr));
                grid-auto-rows: 100px;
            }

            .photo-item--hero {
                grid-column: span 6;
                grid-row: span 3;
            }

            .photo-item--wide,
            .photo-item--tall,
            .photo-item--medium {
                grid-column: span 3;
                grid-row: span 2;
            }

            .photo-item--small {
                grid-column: span 3;
                grid-row: span 2;
            }
        }

        @media (max-width: 640px) {
            .photo-mosaic {
                grid-template-columns: repeat(2, minmax(0, 1fr));
                grid-auto-rows: 140px;
                gap: 10px;
            }

            .photo-item--hero,
            .photo-item--wide,
            .photo-item--tall,
            .photo-item--medium,
            .photo-item--small {
                grid-column: span 2;
                grid-row: span 2;
            }
        }
    </style>
</head>
<body class="unified-page gallery-page">
    <nav class="site-nav">
        <a href="index.html" class="site-nav-brand">yiyisa's space</a>
        <div class="site-nav-links">

        <figure class="photo-item photo-item--small">

        <figure class="photo-item photo-item--wide">
            <img src="ff7/t3.jpg" alt="光影 02">

        <figure class="photo-item photo-item--medium">

    <script>
        const items = document.querySelectorAll('.photo-item');
        const observer = new IntersectionObserver((entries) => {
            entries.forEach((entry) => {
                if (!entry.isIntersecting) return;
                entry.target.classList.add('is-visible');
                observer.unobserve(entry.target);
            });
        }, { threshold: 0.15 });

        items.forEach((item, index) => {
            item.style.transitionDelay = `${Math.min(index * 50, 400)}ms`;
            observer.observe(item);
        });
    </script>
